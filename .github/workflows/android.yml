name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache for Gradle'
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: ${{ github.event.inputs.use_cache != 'false' && 'gradle' || '' }}

      - name: Cache Gradle Build Files
        if: ${{ github.event.inputs.use_cache != 'false' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode and create secrets
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/xed.keystore
          echo "${{ secrets.PROP }}" | base64 -d > /tmp/signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Release Info
        id: release_info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "3.4.4")
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Xed-Editor ${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v${VERSION_NAME}-${COMMIT_HASH}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Xed-Editor v${VERSION_NAME} (${COMMIT_HASH})" >> $GITHUB_ENV
          fi

      - name: Clone submodules
        run: git submodule update --init --recursive

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon && mv app/build/outputs/apk/release/*.apk app/xed-editor-${{ env.COMMIT_HASH }}.apk
        env:
          KEYSTORE_FILE: /tmp/xed.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\""
        continue-on-error: false

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: Xed-Editor-Release
          path: app/xed-editor-${{ env.COMMIT_HASH }}.apk

      - name: Delete secrets
        run: rm -f /tmp/xed.keystore /tmp/signing.properties

      - name: Generate Plugin Sdk
        run: |
          bash plugin-sdk/build-auto.sh || true

      - name: Publish APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/xed-editor-${{ env.COMMIT_HASH }}.apk"
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### Automated Build Release
            - **Version**: ${{ env.VERSION_NAME }}
            - **Commit**: [${{ env.COMMIT_HASH }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Commit Message**: ${{ github.event.head_commit.message }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
